<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED7B0"/>
      <stop offset="50%" stop-color="#D7AF7D"/>
      <stop offset="100%" stop-color="#BE8A50"/>
    </linearGradient>
    <filter id="tileShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#301A0A" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background tile shadow & base -->
  <rect x="36" y="36" width="440" height="440" rx="64" fill="url(#woodGrad)" stroke="#8B5A2B" stroke-width="12" filter="url(#tileShadow)"/>

  <!-- Inner border -->
  <rect x="52" y="52" width="408" height="408" rx="50" fill="none" stroke="#A66F38" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Star top right -->
  <text x="375" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="bold" fill="#D48827" text-anchor="middle">★</text>

  <!-- Letter C -->
  <text x="235" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="250" font-weight="800" fill="#3D200E" text-anchor="middle">C</text>

  <!-- Subscript 3 -->
  <text x="385" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="80" font-weight="700" fill="#5A3418" text-anchor="middle">3</text>
</svg>
